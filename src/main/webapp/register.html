<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register Student</title><link rel="stylesheet" href="css/style.css"></head><body class="content-page"><main class="page-shell"><section class="hero"><div><div class="eyebrow">STUDENT MANAGEMENT</div><h1>Register a Student</h1><p>Enter the details below. Server-side validation runs before the record is saved to MySQL.</p></div><div class="hero-mark">01</div></section><section class="card"><form action="register" method="post" autocomplete="off"><div class="form-section-title">Personal Information</div><div class="form-grid"><div class="field"><label>Full Name</label><input name="fullName" maxlength="100" required placeholder="Enter full name"></div><div class="field"><label>Email Address</label><input type="email" name="email" maxlength="120" required placeholder="student@example.com"></div><div class="field"><label>Phone Number</label><input type="tel" name="phone" minlength="10" maxlength="15" pattern="[0-9]{10,15}" required placeholder="10–15 digit number"></div><div class="field"><label>Date of Birth</label><input type="date" name="dateOfBirth" required></div><div class="field"><label>Gender</label><select name="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Course</label><select name="course" required><option value="">Select course</option><option>B.Tech CSE</option><option>B.Tech IT</option><option>B.Tech ECE</option><option>B.Tech EEE</option><option>B.Tech ME</option><option>BCA</option><option>MCA</option></select></div><div class="field full-width"><label>Address</label><textarea name="address" maxlength="255" rows="4" required placeholder="Enter complete address"></textarea></div></div><div class="form-footer"><div class="security-note"><span class="shield">✓</span>JDBC prepared statements protect database inserts.</div><button class="primary-button" type="submit">Register Student</button></div></form></section></main></body></html>
